[build]
builder = "nixpacks"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["nodejs_22", "python3"]

[build.nixpacksPlan.phases.install]
cmds = ["npm install -g pnpm@9.0.0", "pnpm install --no-frozen-lockfile"]

[build.nixpacksPlan.phases.build]
cmds = ["cd apps/api && npx prisma generate && pnpm run build"]

[deploy]
startCommand = "cd apps/api && node dist/index.js"