[build]
builder = "nixpacks"
buildCommand = "pnpm install --no-frozen-lockfile && cd apps/api && pnpm exec prisma generate --schema=src/prisma/schema.prisma && pnpm exec tsc -p tsconfig.json"

[deploy]
startCommand = "cd apps/api && node dist/index.js"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["nodejs_18", "python3", "openssl"]